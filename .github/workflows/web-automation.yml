name: Web Automation (Every 5 Minutes)

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  automate:
    name: Web Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Web Automation
        run: node automation.js
        env:
          TARGET_URL: ${{ secrets.TARGET_URL || 'https://zealous-river-220556.puter.site/' }}

      - name: Upload automation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-results-${{ github.run_id }}
          path: automation-results/
          retention-days: 7

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let body = `## 🚨 Automation Failure\n\n**Workflow:** ${context.workflow}\n**Run:** ${context.runId}\n**Time:** ${new Date().toISOString()}\n\n`;
            
            // Try to attach recent logs
            const resultsDir = 'automation-results';
            if (fs.existsSync(resultsDir)) {
              const dirs = fs.readdirSync(resultsDir).filter(d => d.startsWith('automation-'));
              if (dirs.length > 0) {
                const latestDir = dirs.sort().reverse()[0];
                const logFiles = fs.readdirSync(path.join(resultsDir, latestDir)).filter(f => f.endsWith('.log'));
                if (logFiles.length > 0) {
                  const logContent = fs.readFileSync(path.join(resultsDir, latestDir, logFiles[0]), 'utf8');
                  const lastLines = logContent.split('\n').slice(-50).join('\n');
                  body += `### Recent Logs:\n\`\`\`\n${lastLines}\n\`\`\`\n\n`;
                }
              }
            }
            
            body += `[View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Automation Failure: ${context.workflow} - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['automation', 'failure', 'scheduled']
            });